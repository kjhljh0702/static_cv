<!doctype html>
<html lang="ko" data-theme="light" data-view="classic">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="정적 분석과 코드 인텔리전스를 연구하는 이정훈의 웹 CV"
    />
    <title>이정훈 CV</title>
    <link rel="icon" type="image/jpeg" href="res/my_profile.jpeg" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <script type="module" src="metaverse.js?v=184.1"></script>
  </head>
  <body>
    <a class="skip-link" href="#content-panel">본문으로 바로가기</a>

    <div class="metaverse-stage" id="metaverse-stage" aria-hidden="true">
      <canvas id="metaverse-canvas"></canvas>
      <div class="metaverse-hud metaverse-hud-left">MYHUB // DIGITAL TWIN</div>
      <div class="metaverse-hud metaverse-hud-right">THREE.JS r184</div>
    </div>

    <header class="site-header" id="site-header">
      <div class="header-shell">
        <button
          class="icon-button mobile-menu-button"
          id="menu-button"
          type="button"
          aria-label="메뉴 열기"
          aria-controls="main-navigation"
          aria-expanded="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>

        <a class="brand" href="#top" aria-label="CV 맨 위로">
          <span class="brand-mark" aria-hidden="true">J</span>
          <span id="header-name">이정훈 · Jeonghun Lee</span>
        </a>

        <nav class="main-navigation" id="main-navigation" aria-label="이력서 섹션">
          <div class="navigation-links" id="navigation-links"></div>
        </nav>

        <div class="header-actions">
          <button class="icon-button" id="print-button" type="button" aria-label="이력서 인쇄">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 8V4h10v4M7 17H5a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M7 14h10v6H7z" />
            </svg>
          </button>

          <button
            class="icon-button view-button"
            id="view-button"
            type="button"
            aria-label="3D 메타버스 모드 켜기"
            aria-pressed="false"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z" />
              <path d="m4.4 7.7 7.6 4.4 7.6-4.4M12 12.1V21" />
            </svg>
          </button>

          <button class="icon-button" id="theme-button" type="button" aria-label="다크 모드 켜기">
            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.2 15.4A8.5 8.5 0 0 1 8.6 3.8 8.5 8.5 0 1 0 20.2 15.4Z" />
            </svg>
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3.5" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
          </button>

          <button class="language-button" id="language-button" type="button" aria-label="Switch to English">
            EN
          </button>
        </div>
      </div>
    </header>

    <main class="page-shell" id="top">
      <aside class="profile-panel" id="profile-panel" aria-label="프로필"></aside>
      <div class="content-panel" id="content-panel" tabindex="-1">
        <div class="loading-state" id="loading-state" role="status">
          <span class="loading-dot" aria-hidden="true"></span>
          <span>CV 데이터를 불러오는 중입니다.</span>
        </div>
      </div>
    </main>

    <dialog class="media-dialog" id="media-dialog" aria-labelledby="media-caption">
      <button class="dialog-close" id="dialog-close" type="button" aria-label="이미지 닫기">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18" />
        </svg>
      </button>
      <img id="media-image" src="" alt="" />
      <p id="media-caption"></p>
    </dialog>

    <noscript>
      <p class="noscript-message">이 CV를 보려면 JavaScript를 활성화해 주세요.</p>
    </noscript>
  </body>
</html>
